services:
  # ============================================================================
  # 1. ZK Proving Microservice (FastAPI + ezkl + Halo2/KZG Engine)
  # ============================================================================
  zk-prover:
    build:
      context: .
      dockerfile: zk-proving-service/Dockerfile
    container_name: veriscore-zk-prover
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - HOME=/app
    volumes:
      - zk-artifacts:/app/artifacts
    networks:
      - veriscore-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================================================
  # 2. Backend API Gateway (Node.js + Express)
  # ============================================================================
  backend-api:
    build:
      context: .
      dockerfile: backend-api/Dockerfile
    container_name: veriscore-backend-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - PROVER_SERVICE_URL=http://zk-prover:8000
    depends_on:
      zk-prover:
        condition: service_healthy
    networks:
      - veriscore-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # 3. Frontend Web Demo (React + Vite + Nginx Reverse Proxy)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: veriscore-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend-api:
        condition: service_healthy
    networks:
      - veriscore-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

# ==============================================================================
# Networks & Persistent Storage
# ==============================================================================
networks:
  veriscore-net:
    driver: bridge
    name: veriscore-network

volumes:
  zk-artifacts:
    name: veriscore-zk-artifacts
