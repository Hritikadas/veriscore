# ==============================================================================
# Veriscore Render Blueprint — FREE TIER with DOCKER
# ==============================================================================
# All 3 services use Docker containers on Render's free plan.
#
# Free tier constraints:
#   - 512 MB RAM per service, 0.1 CPU
#   - Services spin down after 15 min of inactivity (30-60s cold start)
#   - 750 free instance-hours/month (shared across all services)
#   - No inter-container DNS: services use public .onrender.com URLs
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. ZK Proving Microservice (FastAPI + ezkl + ONNX Runtime)
  #    Uses Dockerfile.render which excludes torch (~2GB) to fit in 512MB RAM.
  # ----------------------------------------------------------------------------
  - type: web
    name: veriscore-zk-prover
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: zk-proving-service/Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: HOME
        value: /app

  # ----------------------------------------------------------------------------
  # 2. Backend API Gateway (Node.js Express)
  #    Uses Dockerfile.render which reads PORT from Render's env.
  # ----------------------------------------------------------------------------
  - type: web
    name: veriscore-backend-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: backend-api/Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: PROVER_SERVICE_URL
        fromService:
          type: web
          name: veriscore-zk-prover
          property: hostport
          envVarKey: RENDER_EXTERNAL_URL

  # ----------------------------------------------------------------------------
  # 3. Frontend (React + Vite + Nginx with envsubst)
  #    Nginx reverse-proxies /api/* to the backend's public Render URL.
  # ----------------------------------------------------------------------------
  - type: web
    name: veriscore-frontend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: frontend/Dockerfile.render
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: veriscore-backend-api
          property: hostport
          envVarKey: RENDER_EXTERNAL_URL
